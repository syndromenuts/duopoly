<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duopoly</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="toast" hidden></div>

<section id="lobby" hidden>
  <h1>Duopoly</h1>
  <div id="join-form" class="card" hidden>
    <h2>Join the game</h2>
    <form id="join">
      <input id="join-name" maxlength="20" placeholder="Your name" autocomplete="off" required>
      <div id="join-colors" class="swatches"></div>
      <button type="submit">Join</button>
    </form>
  </div>
  <div class="card">
    <h2>Players</h2>
    <ul id="lobby-players" class="plain"></ul>
    <div id="lobby-me" hidden>
      <button id="ready-btn"></button>
      <button id="leave-btn" class="secondary">Leave</button>
    </div>
    <p class="hint">The game starts when at least 2 players have joined and everyone is ready.</p>
  </div>
  <div class="card">
    <h2>Rules</h2>
    <label><input type="checkbox" data-rule="free_parking"> House rule: taxes and fines go to a Free Parking pot</label>
    <label><input type="checkbox" data-rule="double_go"> House rule: $400 for landing exactly on GO</label>
    <label><input type="checkbox" data-rule="jail_no_rent"> House rule: no rent is collected while the owner is in Jail</label>
    <label>Starting cash $<input id="start-cash" type="number" min="100" max="10000" step="50"></label>
    <p class="hint">Changing a rule un-readies everyone.</p>
  </div>
</section>

<section id="game" hidden>
  <div id="board">
    <div id="center">
      <div id="deck-chance" class="deck chance"><div class="back"><span>?</span>CHANCE<span>?</span></div><div class="face" hidden></div></div>
      <div id="dice-box"><div id="dice" class="dice"><span></span><span></span></div><div id="end-turn" class="end-turn" hidden><button data-act="end_turn" class="danger">End turn</button></div></div>
      <div id="dev-dice" hidden title="Dev mode: choose the next roll (? is random)"><select aria-label="First die"><option value="">?</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><select aria-label="Second die"><option value="">?</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div id="center-info"></div>
      <div id="deck-chest" class="deck chest"><div class="back"><img src="chest.png" alt="">COMMUNITY CHEST</div><div class="face" hidden></div></div>
    </div>
    <div id="buy-offer" hidden><div id="buy-cash"></div><div class="card deed" id="buy-body"></div></div>
    <span id="mover" class="dot" hidden></span>
    <div id="flyer" class="face" hidden></div>
    <div id="money" hidden></div>
  </div>
  <aside id="side">
    <div id="me" class="card"></div>
    <div id="trade-act"></div>
    <div class="card collapsed" id="log-card"><h3 id="log-toggle" role="button" tabindex="0" title="Show or hide the full log">Log</h3><ol id="log" class="plain"></ol></div>
    <div id="game-acts"></div>
    <ol id="turns" class="plain"></ol>
  </aside>
</section>

<div id="auction" class="modal" hidden>
  <div class="card auction-card">
    <div class="deed" id="auction-deed"></div>
    <div id="auction-bid">
      <div class="gavel" aria-hidden="true"></div>
      <div id="auction-info"></div>
      <div id="auction-controls">
        <div class="line">
          <button data-inc="1">+$1</button>
          <button data-inc="10">+$10</button>
          <button data-inc="100">+$100</button>
        </div>
        <div class="line">
          <input id="bid-amount" type="number" min="1" placeholder="Amount">
          <button id="bid-btn" class="accept">Bid</button>
        </div>
        <button id="pass-btn" class="danger">Pass</button>
      </div>
    </div>
  </div>
</div>

<div id="player-modal" class="modal" hidden><div class="card player-card" id="player-body"></div></div>

<div id="prop-modal" class="modal" hidden><div class="card deed" id="prop-body"></div></div>

<div id="offer-modal" class="modal" hidden><div class="card offer" id="offer-body"></div></div>

<div id="trade-modal" class="modal" hidden>
  <div class="card trade-card">
    <h2 id="trade-title"></h2>
    <div id="trade-view"></div>
    <div class="acts">
      <button id="trade-send">Offer trade</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
